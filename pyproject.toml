[build-system]
requires = ["hatchling>=1.33.0", "hatch-vcs>=0.5.0"]
build-backend = "hatchling.build"

[project]
name = "sqlearn"
dynamic = ["version"]
description = "Machine learning computed inside DuckDB, on data larger than memory."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Tomas Pecukevicius", email = "pecukevicius@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    # The engine every computation runs in.
    "duckdb>=2.0.0",
    # The small matrix a Gram step learns from: DuckDB has no eigen or solve
    # function (ADR 0057).
    "numpy>=2.5.4",
]

[dependency-groups]
test = [
    "catboost>=1.2.10",
    "hypothesis>=6.170.15",
    "lightgbm>=4.7.0",
    "mpmath>=1.4.1",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "scikit-learn>=1.9.1",
]
lint = [
    "mypy>=2.4.1",
    "pydoclint>=0.12.0",
    "ruff>=0.17.3",
    "rumdl>=0.3.2",
    "ty>=0.0.96",
    "typos>=1.51.1",
]
docs = [
    "ipykernel>=7.4.0",
    "myst-nb>=1.4.0",
    "numpy>=2.5.4",
    "numpydoc>=1.11.0",
    "pandas>=3.1.0",
    "pydata-sphinx-theme>=0.24.0",
    "scikit-learn>=1.9.1",
    "sphinx>=9.1.1",
    "sphinx-gallery>=0.22.1",
    "sphinxcontrib-bibtex>=2.7.0",
]

[tool.uv]
# `uv sync` installs every group; none is ever published.
default-groups = ["test", "lint", "docs"]
# The series that wrote the lockfile; an older uv is refused.
required-version = ">=0.13"
# The version comes from git, so the installed package is rebuilt when the
# commit or the tags change.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
# The package's source; hatchling adds pyproject.toml, README.md and LICENSE.
only-include = ["src"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",           # pycodestyle
    "F",                # pyflakes
    "I",                # import order, which the formatter leaves alone
    "B",                # likely bugs
    "BLE",              # `except Exception` needs a noqa and a reason
    "UP",               # the floor's syntax
    "SIM", "C4", "PIE", # simpler equivalents
    "PT",               # pytest's idioms
    "RUF",              # ruff's own, RUF100 among them: no stale noqa
    "N",                # naming
    "PYI",              # typing hygiene, which ty's guide pairs with ANN
    "T20",              # no print in the library
    "D",                # docstrings, on the numpy convention
    "ANN",              # every parameter and return annotated, ANN401 included
]
# A composite assertion with a message of its own reads as well as two.
ignore = ["PT018"]
# Only `_`, `__` and so on are throwaway names. Ruff's default takes any
# `_name` for one, so F811 never saw a private helper defined twice.
dummy-variable-rgx = "^_+$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests: no annotations, and a docstring on every test, its form left free.
"tests/**" = ["ANN", "D2", "D3", "D4"]
# Gallery scripts: a reStructuredText title for a docstring, imports between
# text blocks, and output printed for the reader.
"examples/**" = ["ANN", "D", "E402", "T20"]
"docs/**" = ["ANN", "D"]
# Validations against the references: written like tests.
"validation/**" = ["ANN", "D2", "D3", "D4"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "devdata", "tests", "examples", "docs"]

[tool.ty.rules]
# ty's own approximation of a strict mode.
missing-type-argument = "error"
dynamic-function-decorator-return = "error"
unsound-return-statement = "error"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
# A warning fails the run, whatever ty's default becomes.
error-on-warning = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
# pyarrow ships no type information; sqlearn only checks that it is there.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/src/sqlearn"]  # validation/, and the shared helper steps_for_tests
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m", "not slow",
]
markers = [
    "slow: the larger-than-memory tier; test-all and test-python-versions run it",
    "serial: runs alone, after the parallel pass: it fails beside other tests",
]
xfail_strict = true
# A warning is an error: a deprecation is found the day it appears, not at the next major.
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["sqlearn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# The floor the core spec sets (section 13), measured on the full suite.
fail_under = 95

[tool.numpydoc_validation]
# Every check but the extended summary and See Also, which not every object needs.
checks = ["all", "ES01", "SA01"]
# Private names are not validated.
exclude = ['\._']

[tool.rumdl]
# MD013 alone: prose wraps at 80 columns. Another rule joins with its reason.
enable = ["MD013"]

[tool.rumdl.MD013]
line-length = 80
code-blocks = false
tables = false
# Block quotes hold text quoted as found, so they are left alone.
blockquotes = false
# `rumdl fmt` rewraps a paragraph holding a line over the limit. `reflow-mode`
# stays unset: an invalid value silently resets the whole rule to its defaults.
reflow = true

[tool.typos.files]
# Hidden folders are read, so the hooks and Claude's settings are checked;
# git's objects and the lockfile are not. The tools' caches are excluded
# because typos applies .gitignore only inside a git repository, and the
# hook runs it on an export that has none.
ignore-hidden = false
extend-exclude = [".git/", "uv.lock", ".codegraph/", ".ruff_cache/", ".rumdl_cache/", ".mypy_cache/"]

[tool.typos.default]
# British prose and American identifiers both pass at `en`.
locale = "en"
# The docs index writes a line of short hashes into each Markdown file's front
# matter; they are not words. Nor are the short commit hashes the reviews of
# earlier attempts cite.
extend-ignore-re = ["(?m)^mdindex: \\[.*\\]$", "\\b[0-9a-f]{7,12}\\b"]

[tool.typos.default.extend-words]
# A word typos mistakes for a misspelling goes here once, mapped to itself.
# Tree-structured Parzen Estimator, a hyperparameter search method.
TPE = "TPE"
# False positive rate, a column of the ROC curve (scikit-learn's name).
fpr = "fpr"
# Mean absolute percentage error, a regression metric (scikit-learn's short name).
mape = "mape"
# Family-wise error, as in scikit-learn's SelectFwe feature selector.
Fwe = "Fwe"
# numpy.arange, the range of numbers as an array.
arange = "arange"

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-raises = true
