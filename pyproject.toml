[build-system]
# scikit-build-core runs engine/CMakeLists.txt, which builds DuckDB's module
# from the submodules; nanobind and numpy's headers are what that build needs.
# Pinned exactly: uv.lock does not hold build requirements, so a release of
# one would otherwise change the module unseen. A bump is by hand, and it
# changes the engine's digest (validation/_record.py), so every runner reruns.
# numpy is the version uv.lock gives the runtime.
requires = [
    "scikit-build-core==1.1.2",
    "nanobind==3.1.0",
    "numpy==2.5.4",
    "setuptools-scm==10.3.4",
]
build-backend = "scikit_build_core.build"

[project]
name = "sqlearn"
dynamic = ["version"]
description = "Machine learning computed inside DuckDB, on data larger than memory."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY.md"]
requires-python = ">=3.12"
authors = [{ name = "Tomas Pecukevicius", email = "pecukevicius@gmail.com" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# DuckDB, the engine every computation runs in, is built into the wheel
# (engine/), not a dependency.
dependencies = [
    # The small matrix a Gram step learns from: DuckDB has no eigen or solve
    # function (ADR 0057).
    "numpy>=2.5.4",
]

[dependency-groups]
test = [
    "abi3audit>=0.0.26",
    "catboost>=1.2.10",
    "hypothesis>=6.170.15",
    "lightgbm>=4.7.0",
    "mpmath>=1.4.1",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "scikit-learn>=1.9.1",
]
lint = [
    # The CMake formatter (just fmt-engine, just format). Its licence is
    # MPL-2.0: allowed, as it is for development only, never shipped or
    # compiled in (ADR 0066's rule is for runtime code).
    "gersemi>=0.29.2",
    "mypy>=2.4.1",
    "nanobind==3.1.0",
    "pydoclint>=0.12.0",
    "ruff>=0.17.3",
    "rumdl>=0.3.2",
    "ty>=0.0.96",
    "typos>=1.51.1",
]
docs = [
    "ipykernel>=7.4.0",
    "myst-nb>=1.4.0",
    "numpy>=2.5.4",
    "numpydoc>=1.11.0",
    "pandas>=3.1.0",
    "pydata-sphinx-theme>=0.24.0",
    "scikit-learn>=1.9.1",
    "sphinx>=9.1.1",
    "sphinx-gallery>=0.22.1",
    "sphinxcontrib-bibtex>=2.7.0",
]
# The build system's requirements, installed in the project's environment,
# where sqlearn builds (no-build-isolation-package below). Exactly
# [build-system].requires: the two lists change together
# (tests/engine/test_build.py).
build = [
    "scikit-build-core==1.1.2",
    "nanobind==3.1.0",
    "numpy==2.5.4",
    "setuptools-scm==10.3.4",
]

[tool.uv]
# `uv sync` installs every group; none is ever published.
default-groups = ["build", "test", "lint", "docs"]
# sqlearn builds in the project's environment, not in a new one: an isolated
# build's environment has a new path each time, so after every commit each
# object that reads nanobind's or numpy's headers missed ccache. uv installs
# the build group first (its two-phase install). Locking reads sqlearn's
# version from its build backend, so it needs the group installed too: the
# recipes that lock run `just build-tools` first. The wheel is still built in
# isolation (`just build-package`).
no-build-isolation-package = ["sqlearn"]
# The series that wrote the lockfile; an older uv is refused.
required-version = ">=0.13"
# The version comes from git, so the installed package is rebuilt when the
# commit or the tags change; and when the engine's build files or sources do,
# or a submodule moves.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
    { file = "engine/CMakeLists.txt" },
    { file = "engine/cmake/**" },
    { file = "engine/src/**" },
    { file = "engine/extension/**" },
    { file = ".gitmodules" },
    # The compiler's identity (just compiler-stamp, git-ignored): a compiler
    # update rebuilds the module.
    { file = "engine/.compiler-stamp" },
    # The coverage wheel of just audit-groups (its override in
    # [tool.scikit-build]): never taken for the normal build's cache.
    { env = "SQLEARN_AUDIT_COVERAGE" },
]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.29"
cmake.source-dir = "engine"
ninja.version = ">=1.10"
ninja.make-fallback = false
# A stable build directory, so ccache and ninja reuse the last build: only
# what changed compiles again.
build-dir = "build/{cache_tag}"
# One stable ABI wheel for CPython 3.12 and up.
wheel.py-api = "cp312"
# sqlearn/ from src/; duckdb/, adbc_driver_duckdb/, _duckdb-stubs/ and the
# _duckdb module come from CMake's install (engine/cmake/duckdb_package.cmake).
wheel.packages = ["src/sqlearn"]

[tool.scikit-build.cmake.define]
# DuckDB's official extensions, compiled in.
BUILD_EXTENSIONS = "core_functions;json;parquet;icu"
# The extensions linked into the module: the official four, repeated since
# this replaces duckdb-python's default list, and sqlearn's own
# (engine/extension/).
LINK_EXTENSIONS = "core_functions;json;parquet;icu;sqlearn"

# macOS 15 is the floor (ADR 0062): the module is built for it, and
# scikit-build-core tags the wheel macosx_15_0 from this define.
[[tool.scikit-build.overrides]]
if.platform-system = "^darwin$"
inherit.cmake.define = "append"
cmake.define.CMAKE_OSX_DEPLOYMENT_TARGET = "15.0"

# The coverage wheel of the audit of the groups' claims (just audit-groups,
# validation/_audit.py): sqlearn's C++ with Clang's source-based coverage
# (the coverage flavour, under Homebrew LLVM), DuckDB built as usual and not
# instrumented, in a build directory of its own. Taken only when
# SQLEARN_AUDIT_COVERAGE is set, so the normal wheel never takes it, and the
# module's fingerprints leave it out (validation/_groups.py).
[[tool.scikit-build.overrides]]
if.env.SQLEARN_AUDIT_COVERAGE = true
inherit.cmake.define = "append"
build-dir = "build/coverage-{cache_tag}"
cmake.define.SQ_FLAVOR = "coverage"
cmake.define.CMAKE_TOOLCHAIN_FILE = "cmake/toolchain-llvm.cmake"

# Linux's release wheels, built by the release workflow (.github/workflows/
# release-tier.yml) in manylinux_2_28 with its GCC (spec §3.8). One wheel:
# CPython 3.12's stable ABI serves every later Python. pypa/build builds it
# in isolation; it reads no [tool.uv], so no-build-isolation-package, which
# is for the everyday build, stays out, as `just build-package`'s
# --no-config leaves it out on macOS. Each wheel is checked where
# cibuildwheel installed it (validation/_wheel.py).
[tool.cibuildwheel]
build = "cp312-*"
skip = "*-musllinux_*"
build-frontend = "build"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["abi3audit"]
test-sources = ["validation"]
test-command = "python -m validation._wheel --installed {wheel}"

# The version from git, the numbers hatch-vcs gave.
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

# setuptools-scm reads its settings here: its defaults.
[tool.setuptools_scm]

[tool.ruff]
line-length = 88
# The submodules are other projects' code, never ours to lint or format.
# old_python/ is the frozen library, kept as reference: never linted.
extend-exclude = ["engine/duckdb-python", "engine/third_party", "old_python"]

[tool.ruff.lint]
select = [
    "E", "W",           # pycodestyle
    "F",                # pyflakes
    "I",                # import order, which the formatter leaves alone
    "B",                # likely bugs
    "BLE",              # `except Exception` needs a noqa and a reason
    "UP",               # the floor's syntax
    "SIM", "C4", "PIE", # simpler equivalents
    "PT",               # pytest's idioms
    "RUF",              # ruff's own, RUF100 among them: no stale noqa
    "N",                # naming
    "PYI",              # typing hygiene, which ty's guide pairs with ANN
    "T20",              # no print in the library
    "D",                # docstrings, on the numpy convention
    "ANN",              # every parameter and return annotated, ANN401 included
]
# A composite assertion with a message of its own reads as well as two.
ignore = ["PT018"]
# Only `_`, `__` and so on are throwaway names. Ruff's default takes any
# `_name` for one, so F811 never saw a private helper defined twice.
dummy-variable-rgx = "^_+$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests: no annotations, and a docstring on every test, its form left free.
"tests/**" = ["ANN", "D2", "D3", "D4"]
"docs/**" = ["ANN", "D"]
# Validations against the references: written like tests.
"validation/**" = ["ANN", "D2", "D3", "D4"]
# The start-up check runs before the package's imports, since they import
# duckdb, which the check is about (ADR 0061).
"src/sqlearn/__init__.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.src]
include = ["src", "tests", "docs"]

[tool.ty.rules]
# ty's own approximation of a strict mode.
missing-type-argument = "error"
dynamic-function-decorator-return = "error"
unsound-return-statement = "error"
possibly-unresolved-reference = "warn"

[tool.ty.terminal]
# A warning fails the run, whatever ty's default becomes.
error-on-warning = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
# pyarrow ships no type information; sqlearn only checks that it is there.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # validation/
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m", "not slow",
]
markers = [
    "slow: the larger-than-memory tier; test-all and test-python-versions run it",
    "serial: runs alone, after the parallel pass: it fails beside other tests",
]
xfail_strict = true
# A warning is an error: a deprecation is found the day it appears, not at the next major.
filterwarnings = ["error"]

[tool.coverage.run]
source_pkgs = ["sqlearn"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
# The floor the core spec sets (section 13), measured on the full suite.
fail_under = 95

[tool.numpydoc_validation]
# Every check but the extended summary and See Also, which not every object needs.
checks = ["all", "ES01", "SA01"]
# Private names are not validated.
exclude = ['\._']

[tool.rumdl]
# The submodules are other projects' files, never ours to wrap.
exclude = ["engine/duckdb-python/**", "engine/third_party/**", "old_python/**"]
# MD013 alone: prose wraps at 80 columns. Another rule joins with its reason.
enable = ["MD013"]

[tool.rumdl.MD013]
line-length = 80
code-blocks = false
tables = false
# Block quotes hold text quoted as found, so they are left alone.
blockquotes = false
# `rumdl fmt` rewraps a paragraph holding a line over the limit. `reflow-mode`
# stays unset: an invalid value silently resets the whole rule to its defaults.
reflow = true

[tool.typos.files]
# Hidden folders are read, so the hooks and Claude's settings are checked;
# git's objects and the lockfile are not. The tools' caches are excluded
# because typos applies .gitignore only inside a git repository, and the
# hook runs it on an export that has none. NOTICE holds other projects'
# licence texts as they wrote them, as the submodules hold their files.
ignore-hidden = false
extend-exclude = [".git/", "uv.lock", ".codegraph/", ".ruff_cache/", ".rumdl_cache/", ".mypy_cache/", "engine/duckdb-python/", "engine/third_party/", "NOTICE", "old_python/"]

[tool.typos.default]
# British prose and American identifiers both pass at `en`.
locale = "en"
# The docs index writes a line of short hashes into each Markdown file's front
# matter; they are not words. Nor are the short commit hashes the reviews of
# earlier attempts cite.
extend-ignore-re = ["(?m)^mdindex: \\[.*\\]$", "\\b[0-9a-f]{7,12}\\b"]

[tool.typos.default.extend-words]
# A word typos mistakes for a misspelling goes here once, mapped to itself.
# Tree-structured Parzen Estimator, a hyperparameter search method.
TPE = "TPE"
# False positive rate, a column of the ROC curve (scikit-learn's name).
fpr = "fpr"
# Mean absolute percentage error, a regression metric (scikit-learn's short name).
mape = "mape"
# Family-wise error, as in scikit-learn's SelectFwe feature selector.
Fwe = "Fwe"
# numpy.arange, the range of numbers as an array.
arange = "arange"

[tool.pydoclint]
style = "numpy"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
skip-checking-raises = true
